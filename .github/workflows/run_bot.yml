name: Court Auction Bot

on:
  schedule:
    # 매일 아침 9시(한국 시간)에 실행되도록 설정하는 스케줄러입니다.
    # UTC 기준 시간으로 설정해야 하므로 한국 시간(KST)에서 9시간을 뺀 0시 0분으로 적어줍니다.
    - cron: '0 0 * * *'
  workflow_dispatch: # 버튼을 눌러 내가 원할 때 직접 수동 실행하기 위한 옵션입니다.

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Auction Bot
      env:
        # 이전에 GitHub Secrets에 저장했던 비밀값들을 파이썬 프로그램으로 연결해줍니다.
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # 아래 main.py 부분은 실제 본인의 파이썬 파일명으로 수정해 주세요. (예: bot.py 등)
      run: python main.py
